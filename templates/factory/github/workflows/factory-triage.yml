name: factory-triage
on:
  issues:
    types: [labeled]
  # 멈춘 스테이지를 다시 띄우는 유일한 손잡이다(KTB-8) — sweeper(`.factory/lib/sweeper.js`의 세 번째 팔)와
  # `factory run <stage> <issue> --remote`가 여기로 들어온다. 라벨은 이미 목적 상태에 있으므로 라벨을
  # 다시 건드려 재점화할 수 없다(같은 라벨을 또 붙여도 `labeled` 이벤트가 나지 않는다).
  workflow_dispatch:
    inputs:
      issue:
        description: "issue number"
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  # KTB-26 — 마지막 `Sweep` 스텝이 멈춘 스테이지를 `gh workflow run`으로 다시 띄운다(sweeper의 세 번째 팔).
  # FACTORY_BOT_TOKEN으로 나가지만 잡 권한을 좁혀 두면 폴백이 없다(factory-sweeper.yml과 같은 이유).
  actions: write
# 워크플로마다 **다른** 그룹을 쓴다(KTB-8). GitHub는 `issues: labeled`에 라벨 이름 필터를 주지 않으므로
# 라벨 이벤트 하나가 스테이지 워크플로 5개의 런을 전부 만든다(필터는 아래 잡 레벨 `if`에 있다).
# 그룹을 공유하면 그 5개가 한 대기 슬롯을 두고 서로를 밀어내고(`cancel-in-progress: false`에서도
# GitHub는 그룹당 실행 1 + 대기 1만 유지한다), 조건이 맞는 유일한 런이 취소돼 이슈가 조용히 멈춘다.
# 이슈 단위 상호배제는 concurrency가 아니라 `.factory/lib/claim.js`의 원자적 락 브랜치 claim
# (`refs/heads/factory/lock-<issue>` 원격 push)이 준다 — 두 번째 러너는 `{ok:false, holder}`로 fail closed 한다.
concurrency:
  group: factory-issue-${{ github.event.issue.number || inputs.issue }}-triage
  cancel-in-progress: false
jobs:
  triage:
    # 라벨 이벤트이거나, 멈춘 스테이지를 다시 밀어 넣은 dispatch다(KTB-8). dispatch에는 label이 없으므로
    # `github.event.label.name`은 null이고 contains()는 false다 — 이벤트 이름으로 먼저 가른다.
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["factory:queue"]'), github.event.label.name)
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # **첫 스텝이어야 한다**(KTB-10 I1). setup 뒤에 두면 setup이 실패했을 때 이 env가 비는데,
      # 업로드 스텝은 `if: always()`라 그때도 돌고 경로가 `/**/*.jsonl` — 러너 **루트**에 앵커된
      # glob — 으로 접힌다. `if-no-files-found: ignore`까지 붙어 있어 그 사고는 아무 소리도 내지 않는다.
      # 체크아웃보다 앞이어도 된다: 레포를 한 줄도 읽지 않는 순수한 `echo … >> $GITHUB_ENV`다.
      # `if: always()`는 이 값만은 어떤 실패 뒤에도 서게 한다(업로드 경로의 폴백은 아래에 또 있다 —
      # 방어는 두 겹이다: 여기서 세우고, 거기서 못 섰을 때를 대비한다).
      - name: Resolve the session transcript directory
        if: always()
        # `~`는 셸 확장이지 glob이 아니다 — actions/upload-artifact는 경로를 셸에 넘기지 않으므로
        # `~/.claude/projects/**`는 아무것도 맞히지 못하고, `if-no-files-found: ignore`라 실패조차
        # 하지 않는다(빈 아티팩트가 조용히 올라간다). 트랜스크립트는 산출물 추출의 **1순위 출처**라서
        # (KTB-7) 그 침묵이 사후 조사를 통째로 날린다. 러너의 실제 $HOME을 여기서 굳힌다.
        run: echo "CLAUDE_TRANSCRIPTS=$HOME/.claude/projects" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_BOT_TOKEN }}
      - uses: ./.factory/actions/setup
        with:
          claude: "true"
          test-env: "false"
      - name: Run stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
          FACTORY_RUNNER_ID: gha-${{ github.run_id }}
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
        run: node .factory/bin/run-stage.js triage ${{ github.event.issue.number || inputs.issue }}
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-triage-${{ github.event.issue.number || inputs.issue }}-${{ github.run_id }}
          path: |
            docs/factory/runs/
            .factory/out/
            ${{ env.CLAUDE_TRANSCRIPTS || format('{0}/.factory/out', github.workspace) }}/**/*.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
      # KTB-24 — 잡 타임아웃(위 `timeout-minutes`)과 취소는 `run-stage.js`의 `finally`를 **실행하지 않는다**:
      # 락 `refs/heads/factory/lock-<n>`이 고아로 남고, 전이도 코멘트도 run 기록도 없이 이슈가 진입 라벨에
      # 그대로 앉는다(데모 #15: review가 45 m 19 s에 잘렸고 아무 흔적도 남지 않았다). 이 스텝이 그 잔해를
      # 치운다 — `aborted:` 기록 한 줄 + 락 해제 + (이슈가 아직 이 스테이지의 in-flight 라벨일 때만)
      # `factory:blocked` 전이(origin 마커가 함께 찍혀 sweeper가 다음 걸음을 안다). `claude`는 뜨지 않는다.
      # **작아야 한다**: 취소된 잡의 유예 시간은 짧다(설치는 없다 — setup은 이미 돌았다).
      # `.factory/`를 이벤트 sha로 되돌리는 이유: implement는 에이전트 브랜치 위에, review·merge는 PR head로
      # detach된 트리 위에 있다 — 정리 코드만은 언제나 base의 것이어야 한다.
      # `if: always() && job.status != 'success'`인 이유(ADR-020 KTB-24 fix): `cancelled()`는 "런이 취소됐다",
      # `failure()`는 "앞 스텝이 실패했다"만 참으로 만든다 — 잡 타임아웃·러너 소실처럼 그 어느 쪽으로도
      # 분류되지 않는 끝맺음에서는 정리 스텝이 통째로 건너뛰어지고, 고아 락과 침묵이 그대로 남는다(데모 #15).
      # `always()`로 언제나 평가하고 성공만 빼면 "성공이 아닌 모든 끝"이 정확히 한 조건에 들어온다.
      - name: Aborted cleanup
        if: always() && job.status != 'success'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
          FACTORY_RUNNER_ID: gha-${{ github.run_id }}
        run: |
          git checkout ${{ github.sha }} -- .factory || true
          node .factory/bin/run-stage.js triage ${{ github.event.issue.number || inputs.issue }} --aborted "${{ job.status }}"
      # KTB-26 — cron(`factory-sweeper.yml`, 30분)은 믿을 수 없다: 데모에서 몇 시간짜리 공백이 났고,
      # 취소된 sweeper 런이 #15를 30분 넘게 방치했다. 그래서 sweeping은 **이벤트 구동이기도** 하다 —
      # 스테이지가 끝날 때마다(성공·실패·취소 불문) 빠른 팔만 한 번 돌린다: 멈춘 스테이지 재점화 ·
      # blocked 처리 · 라벨-셋 복구. 격리 TTL·토큰 만료는 cron의 몫으로 남는다(`--quick`).
      # 멱등하고 마커로 dedupe되므로 cron sweep과 겹쳐 돌아도 안전하다.
      - name: Sweep
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
        run: |
          git checkout ${{ github.sha }} -- .factory || true
          node .factory/bin/sweep.js --quick
