name: factory-sweeper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  # 멈춘 스테이지를 `gh workflow run`으로 다시 띄운다(KTB-8, sweeper의 세 번째 팔) — 그 호출에 필요하다.
  # GITHUB_TOKEN이 아니라 FACTORY_BOT_TOKEN으로 나가지만, 잡 권한을 좁혀 두면 폴백이 없다.
  actions: write
concurrency:
  group: factory-sweeper
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    # ADR-020 r2 SF5 — 5분은 라벨 변경이 `gh` 한 번이던 시절의 예산이다. KTB-30 이후 한 번의 스왑은
    # 최대 ~39초를 잘 수 있고(1s·3s·9s 재시도 ×2 + verify + REST 폴백), 이 잡은 여덟 팔에서 라벨을
    # 만진다 — 넓은 API 장애, 곧 복구 팔이 가장 할 일이 많은 상황에서 잡이 SIGKILL됐다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_BOT_TOKEN }}
      - uses: ./.factory/actions/setup
        with:
          claude: "false"
          test-env: "false"
      - name: Sweep
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
        run: node .factory/bin/sweep.js
