name: factory-retro
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: factory-retro
  cancel-in-progress: false
jobs:
  retro:
    if: github.event.pull_request.merged == true
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_BOT_TOKEN }}
      - uses: ./.factory/actions/setup
        with:
          claude: "true"
          test-env: "false"
      - name: Retro
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
          FACTORY_RUNNER_ID: gha-${{ github.run_id }}
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
        run: node .factory/bin/retro.js
      - name: Upload retro outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-retro-${{ github.run_id }}
          path: |
            .factory/out/
          include-hidden-files: true
