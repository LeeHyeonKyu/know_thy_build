name: factory-retro
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  issues: write
  pull-requests: write
  # KTB-26 — 마지막 `Sweep` 스텝이 멈춘 스테이지를 `gh workflow run`으로 다시 띄운다.
  actions: write
concurrency:
  group: factory-retro
  cancel-in-progress: false
jobs:
  retro:
    if: github.event.pull_request.merged == true
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      # **첫 스텝이어야 한다**(KTB-10 I1). setup 뒤에 두면 setup이 실패했을 때 이 env가 비는데,
      # 업로드 스텝은 `if: always()`라 그때도 돌고 경로가 `/**/*.jsonl` — 러너 **루트**에 앵커된
      # glob — 으로 접힌다. `if-no-files-found: ignore`까지 붙어 있어 그 사고는 아무 소리도 내지 않는다.
      # 체크아웃보다 앞이어도 된다: 레포를 한 줄도 읽지 않는 순수한 `echo … >> $GITHUB_ENV`다.
      # `if: always()`는 이 값만은 어떤 실패 뒤에도 서게 한다(업로드 경로의 폴백은 아래에 또 있다 —
      # 방어는 두 겹이다: 여기서 세우고, 거기서 못 섰을 때를 대비한다).
      - name: Resolve the session transcript directory
        if: always()
        # `~`는 셸 확장이지 glob이 아니다 — actions/upload-artifact는 경로를 셸에 넘기지 않으므로
        # `~/.claude/projects/**`는 아무것도 맞히지 못하고, `if-no-files-found: ignore`라 실패조차
        # 하지 않는다(빈 아티팩트가 조용히 올라간다). 트랜스크립트는 산출물 추출의 **1순위 출처**라서
        # (KTB-7) 그 침묵이 사후 조사를 통째로 날린다. 러너의 실제 $HOME을 여기서 굳힌다.
        run: echo "CLAUDE_TRANSCRIPTS=$HOME/.claude/projects" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # 머지된 PR의 head/merge ref가 아니라 **머지된 결과가 있는 base 브랜치**를 본다 — retro는
          # 이 저장소의 현재 상태(하네스·역할·lessons·파일 목록)를 읽어 판단한다.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.FACTORY_BOT_TOKEN }}
      - uses: ./.factory/actions/setup
        with:
          claude: "true"
          test-env: "false"
      - name: Retro
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
          FACTORY_RUNNER_ID: gha-${{ github.run_id }}
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
        run: node .factory/bin/retro.js
      # ADR-020 최종 리뷰 SF-1 — **업로드 전에 크리덴셜을 지운다.** 바로 아래 업로드는 `.factory/out/`과
      # `claude -p` 세션 트랜스크립트를 통째로 올리고, 공개 저장소에서 그 아티팩트는 **레포 read 권한자
      # 누구나** 받는다. 그리고 이 체크아웃 트리에는 토큰이 **실제로** 있다: `actions/checkout`이 심는
      # `.git/config`의 `AUTHORIZATION: basic <base64(x-access-token:<token>)>`이다. 그 헤더는 락
      # push(`claim.js`)와 run 기록 push(`records-branch.js`)가 나가는 유일한 경로라
      # `persist-credentials: false`로 끌 수 없다(ADR-020의 알려진 한계) — 그래서 **노출 쪽**을 닫는다:
      # 여기서 한 번 훑고(모양 + 리터럴), 보관은 7일이다(`retention-days`).
      # env의 네 값은 스크립트가 **리터럴로** 지우기 위한 것이고 어디에서도 echo 되지 않는다 —
      # 스크립트가 찍는 것은 종류별 **개수**뿐이다(값을 로그에 적으면 스크럽이 유출 경로가 된다).
      # `.factory/`를 되돌리는 줄은 아래 `Sweep` 스텝의 그것과 **같은 줄**이다 — retro는 base 브랜치를
      # 체크아웃하므로 대개 no-op이지만(실패해도 `|| true`), "팩토리 코드는 언제나 base의 것"이라는
      # 모양을 워크플로마다 같게 둔다.
      - name: Scrub credentials from the artifacts
        # ADR-021 r1 finding 5 — `merge-token-scope` exempts this step only when it BOTH declares this
        # exact `id:` and actually runs scrub-artifacts.js in its `run:`. A free-text step name was
        # not enough of a key: the exception is what lets one step hold every credential at once.
        id: scrub-artifacts
        if: always()
        env:
          FACTORY_BOT_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout ${{ github.sha }} -- .factory || true
          node .factory/bin/scrub-artifacts.js .factory/out "${CLAUDE_TRANSCRIPTS:-$GITHUB_WORKSPACE/.factory/out}"
      - name: Upload retro outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-retro-${{ github.run_id }}
          path: |
            .factory/out/
            ${{ env.CLAUDE_TRANSCRIPTS || format('{0}/.factory/out', github.workspace) }}/**/*.jsonl
          include-hidden-files: true
          # 기본값은 90일이다 — 이 아티팩트가 공개 저장소에서 석 달 동안 내려받힌다는 뜻이다(SF-1).
          # 값은 `yml-lint`의 `artifact-retention`이 지킨다(명시 필수, 14일 이하).
          retention-days: 7
          if-no-files-found: ignore
      # KTB-26 — cron(`factory-sweeper.yml`, 30분)은 믿을 수 없다: 데모에서 몇 시간짜리 공백이 났고,
      # 취소된 sweeper 런이 #15를 30분 넘게 방치했다. 그래서 sweeping은 **이벤트 구동이기도** 하다 —
      # 스테이지가 끝날 때마다(성공·실패·취소 불문) 상태 복구 팔만 돌린다: in-progress 하트비트 재큐 ·
      # blocked 처리 · 멈춘 스테이지 재점화 · 하네스 주차 해제 · 라벨-셋 복구 · 상태 라벨 0개 복구.
      # 격리 TTL·토큰 만료는 시간에 묶인 팔이라 cron의 몫으로 남는다(`--quick`).
      # 멱등하고 마커로 dedupe되므로 cron sweep과 겹쳐 돌아도 안전하다.
      - name: Sweep
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_BOT_TOKEN }}
        run: |
          git checkout ${{ github.sha }} -- .factory || true
          node .factory/bin/sweep.js --quick
