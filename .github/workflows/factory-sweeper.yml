name: factory-sweeper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # 2026-10-05 실측 — `schedule`은 GitHub가 스로틀한다: 30분 cron이 2026-09-29~10-05 동안 **하루 4~5회**만 돌았다
  # (00:14 · 05:56 · 12:55 …). 그 사이 러너를 못 받아 취소된 review 잡(#201, 15분 뒤 steps=0 cancelled)은
  # 7시간째 아무도 되살리지 않았다 — sweeper가 안전망인데 안전망이 하루 네 번 온다. 그래서 스테이지 워크플로가
  # **끝날 때마다** 한 번 쓴다: 취소·실패·타임아웃이 난 바로 그 자리에서 stalled/blocked 팔이 돈다. cron은 백스톱으로 남긴다.
  # 라벨 이벤트의 fan-out(5개 중 4개 skipped)은 아래 `if`가 거른다. 같은 concurrency 그룹이라 겹치지 않고 줄을 선다.
  workflow_run:
    workflows: [factory-triage, factory-plan, factory-implement, factory-review, factory-merge]
    types: [completed]
permissions:
  contents: write
  issues: write
  # 멈춘 스테이지를 `gh workflow run`으로 다시 띄운다(KTB-8, sweeper의 세 번째 팔) — 그 호출에 필요하다.
  # GITHUB_TOKEN이 아니라 FACTORY_BOT_TOKEN으로 나가지만, 잡 권한을 좁혀 두면 폴백이 없다.
  actions: write
concurrency:
  group: factory-sweeper
  cancel-in-progress: false
jobs:
  sweep:
    # workflow_run에서는 실제로 돈 스테이지가 끝났을 때만 — fan-out의 skipped 런은 아무것도 바꾸지 않았다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    # ADR-020 r2 SF5 — 5분은 라벨 변경이 `gh` 한 번이던 시절의 예산이다. KTB-30 이후 한 번의 스왑은
    # 최대 ~39초를 잘 수 있고(1s·3s·9s 재시도 ×2 + verify + REST 폴백), 이 잡은 여덟 팔에서 라벨을
    # 만진다 — 넓은 API 장애, 곧 복구 팔이 가장 할 일이 많은 상황에서 잡이 SIGKILL됐다.
    timeout-minutes: 15
    steps:
      # 2026-10-09 (ADR-020 이월 7 · ADR-021) — 에이전트 배우는 GitHub App이다(사유·모양은 factory-triage.yml의 같은 스텝).
      # `FACTORY_APP_ID`·`FACTORY_APP_PRIVATE_KEY`가 없으면 PAT(`FACTORY_BOT_TOKEN`)로 돈다. 체크아웃보다 앞이어야 한다.
      - name: Factory token (GitHub App; the FACTORY_BOT_TOKEN PAT when no App is configured)
        id: factory-token
        if: ${{ secrets.FACTORY_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Factory login
        if: ${{ steps.factory-token.outputs.app-slug != '' }}
        env:
          APP_SLUG: ${{ steps.factory-token.outputs.app-slug }}
        run: echo "FACTORY_BOT_LOGIN=${APP_SLUG}[bot]" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.factory-token.outputs.token || secrets.FACTORY_BOT_TOKEN }}
      - uses: ./.factory/actions/setup
        with:
          claude: "false"
          test-env: "false"
      - name: Sweep
        env:
          GH_TOKEN: ${{ steps.factory-token.outputs.token || secrets.FACTORY_BOT_TOKEN }}
        run: node .factory/bin/sweep.js
      # ADR-021 r1 finding 2 — **머지 권한 판정은 여기에서만 진짜가 된다.** `tokens.agent-is-admin`,
      # `tokens.agent-workflow-scope`, `protection.codeowners`는 전부 "에이전트 배우가 쥔 토큰이
      # 무엇인가"를 묻는데, 그 토큰으로 `gh`가 도는 곳은 이 잡뿐이다(머지 잡의 `GH_TOKEN`은 머지
      # 배우의 것이라 거기서 물으면 **엉뚱한 계정**을 판정한다). 사람의 로컬 doctor는 이 셋을
      # WARN "unverified until CI"로 남기고, 이 스텝이 그 WARN을 실제 등급으로 바꾼다.
      #
      # `continue-on-error: true`인 이유: doctor의 FAIL은 **보고**지 sweeping의 실패가 아니다.
      # 잡을 빨갛게 만들면 락 회수·재점화·라벨 복구 — 곧 팩토리가 멈췄을 때 가장 필요한 팔들 — 이
      # "CI가 빨갛다"는 이유로 사람 손에 꺼지게 된다. 스텝 결과는 non-zero로 남고(런 화면에서 노란
      # 느낌표), 판정 줄은 잡 요약(`$GITHUB_STEP_SUMMARY`)에 그대로 찍힌다.
      - name: Doctor (merge authority)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.factory-token.outputs.token || secrets.FACTORY_BOT_TOKEN }}
          FACTORY_BOT_TOKEN: ${{ steps.factory-token.outputs.token || secrets.FACTORY_BOT_TOKEN }}
        run: node .factory/bin/doctor-ci.js
