name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Test suite
        run: npm test

      - name: CLI smoke test
        run: node bin/cli.js --help

      - name: Template integrity
        run: |
          FAIL=0
          for f in templates/know-thy-build/*.md; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "❌ Missing frontmatter: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "✅ All templates have frontmatter"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): the registry trusts this repo + workflow directly,
    # so no NPM_TOKEN secret is needed — only the id-token permission.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Check if version changed
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view know-thy-build version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $LOCAL (remote: $REMOTE)"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already published, skipping"
          fi

      - name: Publish (trusted publishing, provenance attached)
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public
